name: HH Auto Renew

on:
  schedule:
    # 每天北京时间 09:10 检查一次
    # 脚本自己判断：距到期 ≤2 天才续期，否则跳过
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制续期（忽略到期日）'
        required: false
        default: 'false'

jobs:
  Renew-HH:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb x11-utils xdotool scrot fonts-noto-cjk

      - name: 📦 安装 Python 依赖
        run: |
          pip install --no-cache-dir seleniumbase requests PySocks
          seleniumbase install chromedriver

      - name: ⚙ 设置代理（可选）
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          else
            echo "未配置 NODE_LINK，直连"
          fi

      - name: 🍪 恢复 cookie
        env:
          HH_COOKIES: ${{ secrets.HH_COOKIES }}
          TG_COOKIES: ${{ secrets.TG_COOKIES }}
        run: |
          if [ -n "$HH_COOKIES" ]; then
            printf '%s' "$HH_COOKIES" > hh_cookies.json
            echo "已从 Secret 恢复 cookie（$(wc -c < hh_cookies.json) bytes）"
          else
            echo "无 cookie Secret，本次将走登录流程"
          fi
          if [ -n "$TG_COOKIES" ]; then
            printf '%s' "$TG_COOKIES" > tg_cookies.json
            echo "已从 Secret 恢复 TG 会话 cookie（$(wc -c < tg_cookies.json) bytes）"
          fi

      - name: 🚀 运行续期
        env:
          HH_SITE:            ${{ secrets.HH_SITE }}
          HH_PHONE:           ${{ secrets.HH_PHONE }}
          IMAP_HOST:          ${{ secrets.IMAP_HOST }}
          IMAP_PORT:          ${{ secrets.IMAP_PORT }}
          EMAIL_USER:         ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          MAIL_SUBJECT:       ${{ secrets.MAIL_SUBJECT }}
          TG_BOT_TOKEN:       ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
          DUMP_PAGE:          ${{ secrets.DUMP_PAGE }}
          FORCE_RENEW:        ${{ github.event.inputs.force || 'false' }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python3 app.py

      - name: 💾 提交状态 + 心跳（防 60 天停用）
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1) 到期日 / cookie 有变化就暂存
          if [ -f hh_state.json ]; then
            git add hh_state.json
          fi

          # 2) GitHub 规则：公开仓库 60 天无提交 → 定时任务自动停用
          #    距上次提交超过 25 天就补一次心跳，永远碰不到 60 天线
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "距上次提交: ${days} 天"

          if [ "$days" -ge 25 ]; then
            printf 'keepalive %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .keepalive
            git add .keepalive
            echo "⏰ 已触发心跳提交"
          fi

          if git diff --cached --quiet; then
            echo "ℹ️ 无变化，跳过提交"
          else
            git commit -m "chore: 自动更新 $(date -u +%Y-%m-%d)"
            git push || true
            echo "✅ 已提交"
          fi

      - name: 🍪 上传新 cookie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cookies
          path: |
            hh_cookies.json
            tg_cookies.json
          retention-days: 1
          if-no-files-found: ignore

      - name: 📄 上传诊断文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: |
            dump-*.html
            step-*.html
            step-*.png
            steps.log
          retention-days: 3
          if-no-files-found: ignore

      - name: 📸 上传失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧹 清理旧运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 \
            --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 5 ]; then
              gh run delete $run_id || true
            fi
          done
